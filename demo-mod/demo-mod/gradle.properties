# More memory for Gradle, and parallel builds.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric versions. If any of these fail to resolve, copy the current set for
# Minecraft 1.21.1 from https://fabricmc.net/develop (it lists these exact lines).
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.5
fabric_version=0.102.0+1.21.1
loom_version=1.7-SNAPSHOT

# Mod identity.
mod_version=1.0.0
maven_group=edu.tamu.csce465
archives_base_name=csce465-demo
